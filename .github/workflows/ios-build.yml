name: iOS unsigned build (for Sideloadly)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    # Needed to create a release and upload an asset to it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        # The run number as build number: every IPA is a genuinely new
        # version, so Sideloadly/iOS always replaces the installed one.
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Package as unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r PescarDelta-unsigned.ipa Payload

      # A release asset rather than an Actions artifact: artifact storage on a
      # private repo is capped, release assets have a separate allowance.
      - name: Publish the IPA as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-build-${{ github.run_number }}" \
            PescarDelta-unsigned.ipa \
            --draft \
            --title "iOS unsigned build #${{ github.run_number }}" \
            --notes "Unsigned IPA for Sideloadly, built from ${{ github.sha }}."
